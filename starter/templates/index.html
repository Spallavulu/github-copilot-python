<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Sudoku Game</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}"
    >
</head>

<body>
    <main class="container">
        <h1>Sudoku Game</h1>

        <div class="toolbar">
            <label for="difficulty">Difficulty:</label>

            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
            </select>

            <button id="new-game" type="button">
                New Game
            </button>

            <button id="check-solution" type="button">
                Check Puzzle
            </button>

            <button id="hint-button" type="button">
                Hint
            </button>

            <button id="dark-mode-toggle" type="button">
                Dark Mode
            </button>
        </div>

        <div id="timer">Time: 00:00</div>

        <div
            id="message"
            role="status"
            aria-live="polite"
        ></div>

        <section
            id="sudoku-board"
            aria-label="Sudoku board"
        ></section>

        <section class="leaderboard-section">
            <h2>Top 10 Scores</h2>

            <table id="leaderboard">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Name</th>
                        <th>Time</th>
                        <th>Difficulty</th>
                        <th>Hints</th>
                    </tr>
                </thead>

                <tbody></tbody>
            </table>
        </section>
    </main>

    <script
        src="{{ url_for('static', filename='main.js') }}"
    ></script>
</body>
</html>
